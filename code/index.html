<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Scaler - Accelerate your tech career with industry-leading programs">
  <title>Scaler — Homepage Reconstruction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══ HEADER ═══ -->
  <header id="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Scaler</a>
      <button class="mobile-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="mainNav" class="main-nav">
        <div class="nav-links">
            
        </div>
        <div class="nav-cta">
            
        </div>
      </nav>
    </div>
  </header>

  <!-- ═══ HERO SECTION ═══ -->
  <main>
    <section id="hero" class="hero">
      <div class="container hero-inner">
        <div class="hero-content">
          <h1 class="hero-headline">Example Domain</h1>
          <p class="hero-sub">Accelerate your tech career with industry-leading programs.</p>
          <div class="hero-cta">
              
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-graphic"></div>
        </div>
      </div>
      
    </section>
  </main>

  <!-- ═══ FOOTER ═══ -->
  <footer id="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="/" class="logo">Scaler</a>
        <p class="footer-tagline">Accelerating careers in tech</p>
      </div>
      <div class="footer-columns">
        
      </div>
    </div>
    <div class="footer-bottom container">
      <p> 2026 Scaler</p>
      <div class="social-links">
        
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
